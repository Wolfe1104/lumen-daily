<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Light</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }

    body {
      font-family: 'Playfair Display', serif;
      color: #f5e6d3;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(rgba(20,10,5,0.85), rgba(40,15,10,0.9));
      position: relative;
      touch-action: pan-y;
    }

    .background {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -2;
      background: url("file_00000000b05871f8b90495cba20701df.png") no-repeat center center / cover;
      filter: brightness(0.35) sepia(0.3);
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 1;
      transition: opacity 3s ease-out;
    }

    #splash.fadeout {
      opacity: 0;
    }

    #splash img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    /* Main App */
    #app {
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    #app.visible {
      opacity: 1;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: flex-end;
      padding: 20px 30px;
      z-index: 100;
    }

    #current-category {
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      color: #d4af37;
      text-shadow: 0 0 10px rgba(212,175,55,0.6);
      font-style: italic;
    }

    footer.title-block {
      padding: 40px 16px 60px;
      z-index: 10;
    }

    .title-block h1 {
      margin: 0;
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(2.8rem, 9vw, 5rem);
      color: #d4af37;
      text-shadow: 0 0 20px rgba(212,175,55,0.7);
      letter-spacing: 2px;
    }

    #date, #day-counter {
      margin: 20px 0 0;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      color: #e6ccb2;
      font-weight: 300;
    }

    .nav-arrows {
      position: fixed;
      top: 50%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 11;
    }

    .arrow {
      width: 65px;
      height: 65px;
      background: none;
      border: none;
      cursor: pointer;
      filter: drop-shadow(0 0 12px #d4af37);
      transition: transform 0.3s ease;
      pointer-events: all;
    }

    .arrow:hover { transform: scale(1.25); }
    .arrow svg { width: 100%; height: 100%; fill: #d4af37; }

    .menu-btn {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 1001;
      background: rgba(0,0,0,0.4);
      border: 2px solid #d4af37;
      border-radius: 50%;
      cursor: pointer;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .menu-btn:hover {
      background: #d4af37;
      transform: rotate(90deg) scale(1.1);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 20px 40px;
      max-width: 1100px;
      margin: 0 auto;
      z-index: 10;
    }

    #verse {
      font-size: clamp(1.6rem, 5.5vw, 2.8rem);
      margin: 40px 0;
      color: #e6ccb2;
      cursor: pointer;
      transition: all 0.5s ease;
      line-height: 1.7;
    }

    #verse:hover {
      color: #d4af37;
      text-shadow: 0 0 25px rgba(212,175,55,0.9);
      transform: scale(1.02);
    }

    #intro {
      font-size: clamp(1.3rem, 4.5vw, 2rem);
      color: #c19a6b;
      margin: 50px auto;
      cursor: pointer;
      max-width: 90%;
      line-height: 1.9;
      transition: color 0.4s;
    }

    #intro:hover { color: #d4af37; }

    .side-menu {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100vh;
      background: rgba(25,12,6,0.98);
      z-index: 1000;
      transition: left 0.5s cubic-bezier(0.77, 0, 0.175, 1);
      padding: 30px 20px;
      border-right: 4px solid #d4af37;
      box-shadow: 15px 0 40px rgba(0,0,0,0.8);
      overflow-y: auto;
    }

    .side-menu.open {
      left: 0;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      color: #d4af37;
    }

    .menu-header h3 {
      margin: 0;
      font-size: 2rem;
      font-weight: bold;
    }

    .close-menu {
      font-size: 3.5rem;
      cursor: pointer;
      line-height: 1;
      transition: 0.3s;
    }

    .close-menu:hover {
      transform: rotate(90deg);
    }

    .menu-nav {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu-nav button {
      padding: 18px;
      font-size: 1.3rem;
      background: rgba(139,69,19,0.3);
      color: #d4af37;
      border: 2px solid #d4af37;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s ease;
      font-weight: 500;
    }

    .menu-nav button:hover {
      background: #d4af37;
      color: #3f2204;
      transform: translateX(12px) scale(1.05);
      box-shadow: 0 0 20px rgba(212,175,55,0.5);
    }

    .back-daily-btn {
      margin-top: 50px;
      padding: 18px;
      font-size: 1.4rem;
      background: rgba(139,69,19,0.6);
      color: #d4af37;
      border: 2px solid #d4af37;
      border-radius: 20px;
      cursor: pointer;
    }

    .jump-day-btn {
      margin-top: 20px;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 999;
    }

    .overlay.active {
      display: block;
    }

    .jump-popup {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 20px;
    }

    .jump-popup.active {
      display: flex;
    }

    .jump-content {
      background: rgba(40,20,10,0.95);
      padding: 40px;
      border-radius: 25px;
      border: 3px solid #d4af37;
      box-shadow: 0 0 50px rgba(212,175,55,0.6);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .jump-content h3 {
      color: #d4af37;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .jump-content input {
      width: 100%;
      padding: 14px;
      margin: 20px 0;
      border-radius: 20px;
      border: 1px solid #d4af37;
      background: rgba(0,0,0,0.4);
      color: white;
      font-size: 1.2rem;
      text-align: center;
    }

    .jump-content button {
      padding: 12px 30px;
      border-radius: 20px;
      background: #8b4513;
      color: #d4af37;
      border: 1px solid #d4af37;
      cursor: pointer;
      font-size: 1.1rem;
      margin: 0 10px;
    }

    .jump-content button:hover {
      background: #d4af37;
      color: #3f2204;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 20px;
    }

    .modal-content {
      position: relative;
      background: rgba(40,20,10,0.95);
      padding: 60px 40px;
      max-width: 950px;
      border-radius: 25px;
      border: 3px solid #d4af37;
      box-shadow: 0 0 60px rgba(212,175,55,0.7);
      max-height: 90vh;
      overflow-y: auto;
    }

    .close {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 4rem;
      color: #d4af37;
      cursor: pointer;
      line-height: 1;
      transition: 0.3s;
    }

    .close:hover {
      transform: rotate(90deg) scale(1.2);
    }

    #modal-verse {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      margin-bottom: 40px;
      color: #e6ccb2;
      line-height: 1.7;
    }

    #full-interpretation {
      font-size: 1.6rem;
      line-height: 2.1;
      color: #f5e6d3;
      font-style: italic;
      text-align: left;
      white-space: pre-line;
    }

    @media (max-width: 600px) {
      .arrow { width: 55px; height: 55px; }
      .modal-content { padding: 40px 25px; }
      .menu-btn { width: 55px; height: 55px; top: 20px; left: 20px; }
      .side-menu { width: 280px; left: -300px; }
      .side-menu.open { left: 0; }
      footer.title-block { padding: 60px 16px 80px; }
      .jump-content { padding: 30px; }
      header { padding: 15px 20px; }
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash">
    <img src="0G.jpg" alt="Opening Image">
  </div>

  <!-- Main App -->
  <div id="app">
    <div class="background"></div>

    <header>
      <div id="current-category">Anxiety</div>
    </header>

    <button class="menu-btn" onclick="toggleMenu()" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="36" height="36">
        <path fill="#d4af37" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>

    <div class="nav-arrows">
      <button class="arrow" onclick="changeDay(-1)" aria-label="Previous day">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <button class="arrow" onclick="changeDay(1)" aria-label="Next day">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>

    <main>
      <h2 id="verse" onclick="openModal()"></h2>
      <p id="intro" onclick="openModal()"></p>
    </main>

    <footer class="title-block">
      <h1>Daily Light</h1>
      <p id="date"></p>
      <p id="day-counter"></p>
    </footer>

    <aside id="side-menu" class="side-menu">
      <div class="menu-header">
        <h3>Categories</h3>
        <span class="close-menu" onclick="toggleMenu()">&times;</span>
      </div>
      <nav class="menu-nav">
        <button onclick="setCategory('anxiety')">Anxiety</button>
        <button onclick="setCategory('fear')">Fear</button>
        <button onclick="setCategory('grief')">Grief</button>
        <button onclick="setCategory('sadness')">Sadness</button>
        <button onclick="setCategory('confusion')">Confusion</button>
        <button onclick="setCategory('loneliness')">Loneliness</button>
        <button onclick="setCategory('doubt')">Doubt</button>
        <button onclick="setCategory('weariness')">Weariness</button>
        <button class="jump-day-btn" onclick="openJumpPopup()">Jump to Day...</button>
        <button class="back-daily-btn" onclick="setCategory('anxiety'); toggleMenu()">← Back to Daily Verses</button>
      </nav>
    </aside>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="jump-popup" class="jump-popup">
      <div class="jump-content">
        <h3>Jump to Day</h3>
        <input type="number" id="jumpInput" min="1" max="365" placeholder="Enter day (1–365)">
        <div>
          <button onclick="jumpDays()">Go</button>
          <button onclick="closeJumpPopup()">Cancel</button>
        </div>
      </div>
    </div>

    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modal-verse"></h2>
        <p id="full-interpretation"></p>
      </div>
    </div>
  </div>

  <script>
    let dayOffset = 0;
    let currentCategory = "anxiety";

    let touchStartX = 0;
    let touchEndX = 0;
    const swipeThreshold = 60;

    // Placeholder data - replace with your full 365 verses/interpretations
    const versePools = {
      anxiety: [
        "Do not be anxious about anything, but in every situation, by prayer and petition, with thanksgiving, present your requests to God. And the peace of God, which transcends all understanding, will guard your hearts and your minds in Christ Jesus. — Philippians 4:6-7",
        "Cast all your anxiety on him because he cares for you. — 1 Peter 5:7",
        // ... add all 365 unique verses here
      ],
      // other categories...
    };

    const interpretations = {
      anxiety: [
        "This powerful passage reminds us that anxiety doesn't have to rule our lives. Paul, writing from prison, knew real hardship yet discovered a supernatural peace through prayer with thanksgiving...",
        // ... add all matching long interpretations
      ],
      // other categories...
    };

    function getDayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff = date - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay);
    }

    function updateDevotional() {
      const date = new Date();
      date.setDate(date.getDate() + dayOffset);

      const dayIndex = (getDayOfYear(date) - 1) % 365;

      const verses = versePools[currentCategory] || versePools.anxiety;
      const interps = interpretations[currentCategory] || interpretations.anxiety;

      const idx = dayIndex % verses.length;
      const verse = verses[idx] || "God's word shines light today.";
      const fullInterp = interps[idx] || "God meets you tenderly today.";

      document.getElementById("verse").innerText = verse;
      document.getElementById("modal-verse").innerText = verse;

      const introText = fullInterp.length > 180 
        ? fullInterp.substring(0, 180).trim() + '... (tap for full reflection)'
        : fullInterp;
      document.getElementById("intro").innerText = introText;
      document.getElementById("full-interpretation").innerText = fullInterp;

      document.getElementById("day-counter").innerText = `Day ${dayIndex + 1} of 365`;
      document.getElementById("current-category").innerText = 
        currentCategory.charAt(0).toUpperCase() + currentCategory.slice(1);
    }

    function updateDate() {
      const date = new Date();
      date.setDate(date.getDate() + dayOffset);
      document.getElementById("date").innerText = date.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    // Rest of functions unchanged...

    function changeDay(amount) {
      dayOffset += amount;
      updateDate();
      updateDevotional();
    }

    function jumpDays() {
      const input = document.getElementById("jumpInput");
      const value = parseInt(input.value, 10);
      if (value >= 1 && value <= 365) {
        const today = new Date();
        const target = new Date(today.getFullYear(), 0, value);
        const yearStart = new Date(today.getFullYear(), 0, 1);
        dayOffset = Math.floor((target - yearStart) / 86400000);
        updateDate();
        updateDevotional();
        closeJumpPopup();
      }
    }

    function setCategory(category) {
      currentCategory = category;
      updateDevotional();
      toggleMenu();
    }

    function toggleMenu() {
      const menu = document.getElementById("side-menu");
      const overlay = document.getElementById("overlay");
      menu.classList.toggle("open");
      overlay.classList.toggle("active");
    }

    function openJumpPopup() {
      document.getElementById("jump-popup").classList.add("active");
      document.getElementById("jumpInput").focus();
    }

    function closeJumpPopup() {
      document.getElementById("jump-popup").classList.remove("active");
      document.getElementById("jumpInput").value = "";
    }

    function openModal() {
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("modal");
      const popup = document.getElementById("jump-popup");
      if (event.target === modal) closeModal();
      if (event.target === popup) closeJumpPopup();
    };

    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].screenX; }, { passive: true });
    document.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > swipeThreshold) {
        if (diff > 0 && !document.getElementById("side-menu").classList.contains("open")) toggleMenu();
        else if (diff < 0 && document.getElementById("side-menu").classList.contains("open")) toggleMenu();
      }
    }

    // Splash screen + app initialization
    window.addEventListener('load', function() {
      const splash = document.getElementById('splash');
      const app = document.getElementById('app');

      // Display splash for 3 seconds, then fade out over 3 seconds
      setTimeout(() => {
        splash.classList.add('fadeout');
        setTimeout(() => {
          splash.style.display = 'none';
          app.classList.add('visible');
          // Now safely initialize the devotional content
          updateDate();
          updateDevotional();
        }, 3000); // matches fade duration
      }, 3000); // display duration
    });
  </script>
</body>
</html>
