<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Light</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    /* Styles unchanged from previous version */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }

    body {
      font-family: 'Playfair Display', serif;
      color: #f5e6d3;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(rgba(20,10,5,0.85), rgba(40,15,10,0.9));
      position: relative;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    .background {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -2;
      background: url("file_00000000b05871f8b90495cba20701df.png") no-repeat center center / cover;
      filter: brightness(0.35) sepia(0.3);
    }

    footer.title-block {
      padding: 40px 16px 60px;
      z-index: 10;
    }

    .title-block h1 {
      margin: 0;
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(2.8rem, 9vw, 5rem);
      color: #d4af37;
      text-shadow: 0 0 20px rgba(212,175,55,0.7);
      letter-spacing: 2px;
    }

    #date, #day-counter {
      margin: 20px 0 0;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      color: #e6ccb2;
      font-weight: 300;
    }

    .nav-arrows {
      position: fixed;
      top: 50%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 11;
    }

    .arrow {
      width: 65px;
      height: 65px;
      background: none;
      border: none;
      cursor: pointer;
      filter: drop-shadow(0 0 12px #d4af37);
      transition: transform 0.3s ease;
      pointer-events: all;
    }

    .arrow:hover { transform: scale(1.25); }
    .arrow svg { width: 100%; height: 100%; fill: #d4af37; }

    .menu-btn {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 1001;
      background: rgba(0,0,0,0.4);
      border: 2px solid #d4af37;
      border-radius: 50%;
      cursor: pointer;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .menu-btn:hover {
      background: #d4af37;
      transform: rotate(90deg) scale(1.1);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 20px;
      max-width: 1100px;
      margin: 0 auto;
      z-index: 10;
    }

    #verse {
      font-size: clamp(1.6rem, 5.5vw, 2.8rem);
      margin: 40px 0;
      color: #e6ccb2;
      cursor: pointer;
      transition: all 0.5s ease;
      line-height: 1.7;
    }

    #verse:hover {
      color: #d4af37;
      text-shadow: 0 0 25px rgba(212,175,55,0.9);
      transform: scale(1.02);
    }

    #intro {
      font-size: clamp(1.3rem, 4.5vw, 2rem);
      color: #c19a6b;
      margin: 50px auto;
      cursor: pointer;
      max-width: 90%;
      line-height: 1.9;
      transition: color 0.4s;
    }

    #intro:hover { color: #d4af37; }

    .side-menu {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100vh;
      background: rgba(25,12,6,0.98);
      z-index: 1000;
      transition: left 0.5s cubic-bezier(0.77, 0, 0.175, 1);
      padding: 30px 20px;
      border-right: 4px solid #d4af37;
      box-shadow: 15px 0 40px rgba(0,0,0,0.8);
      overflow-y: auto;
    }

    .side-menu.open {
      left: 0;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
      color: #d4af37;
    }

    .menu-header h3 {
      margin: 0;
      font-size: 2rem;
      font-weight: bold;
    }

    .close-menu {
      font-size: 3.5rem;
      cursor: pointer;
      line-height: 1;
      transition: 0.3s;
    }

    .close-menu:hover {
      transform: rotate(90deg);
    }

    .menu-nav {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu-nav button {
      padding: 18px;
      font-size: 1.3rem;
      background: rgba(139,69,19,0.3);
      color: #d4af37;
      border: 2px solid #d4af37;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s ease;
      font-weight: 500;
    }

    .menu-nav button:hover {
      background: #d4af37;
      color: #3f2204;
      transform: translateX(12px) scale(1.05);
      box-shadow: 0 0 20px rgba(212,175,55,0.5);
    }

    .jump-day-btn {
      margin-top: 40px;
      padding: 18px;
      font-size: 1.3rem;
      background: rgba(139,69,19,0.5);
      color: #d4af37;
      border: 2px solid #d4af37;
      border-radius: 20px;
      cursor: pointer;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 999;
    }

    .overlay.active {
      display: block;
    }

    .jump-popup {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 20px;
    }

    .jump-popup.active {
      display: flex;
    }

    .jump-content {
      background: rgba(40,20,10,0.95);
      padding: 40px;
      border-radius: 25px;
      border: 3px solid #d4af37;
      box-shadow: 0 0 50px rgba(212,175,55,0.6);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .jump-content h3 {
      color: #d4af37;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .jump-content input {
      width: 100%;
      padding: 14px;
      margin: 20px 0;
      border-radius: 20px;
      border: 1px solid #d4af37;
      background: rgba(0,0,0,0.4);
      color: white;
      font-size: 1.2rem;
      text-align: center;
    }

    .jump-content button {
      padding: 12px 30px;
      border-radius: 20px;
      background: #8b4513;
      color: #d4af37;
      border: 1px solid #d4af37;
      cursor: pointer;
      font-size: 1.1rem;
      margin: 0 10px;
    }

    .jump-content button:hover {
      background: #d4af37;
      color: #3f2204;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 20px;
    }

    .modal-content {
      position: relative;
      background: rgba(40,20,10,0.95);
      padding: 60px 40px;
      max-width: 950px;
      border-radius: 25px;
      border: 3px solid #d4af37;
      box-shadow: 0 0 60px rgba(212,175,55,0.7);
      max-height: 90vh;
      overflow-y: auto;
    }

    .close {
      position: absolute;
      top: 25px;
      right: 35px;
      font-size: 4rem;
      color: #d4af37;
      cursor: pointer;
      line-height: 1;
      transition: 0.3s;
    }

    .close:hover {
      transform: rotate(90deg) scale(1.2);
    }

    #modal-verse {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      margin-bottom: 40px;
      color: #e6ccb2;
      line-height: 1.7;
    }

    #full-interpretation {
      font-size: 1.6rem;
      line-height: 2;
      color: #f5e6d3;
      font-style: italic;
    }

    @media (max-width: 600px) {
      .arrow { width: 55px; height: 55px; }
      .modal-content { padding: 40px 25px; }
      .menu-btn { width: 55px; height: 55px; top: 20px; left: 20px; }
      .side-menu { width: 280px; left: -300px; }
      .side-menu.open { left: 0; }
      footer.title-block { padding: 60px 16px 80px; }
      .jump-content { padding: 30px; }
    }
  </style>
</head>

</html>
