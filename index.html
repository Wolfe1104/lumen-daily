    function startSplashTimer() {
      if (splashTimerStarted) return;
      splashTimerStarted = true;

      const splash = document.getElementById('splash');
      const app = document.getElementById('app');

      setTimeout(() => {
        splash.classList.add('fadeout');
        setTimeout(() => {
          splash.style.display = 'none';
          app.classList.add('visible');
          updateDate();
          updateDevotional();
        }, 3000);
      }, 3000);
    }

    function getDayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff = date - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay);
    }

    function updateDevotional() {
      const date = new Date();
      date.setDate(date.getDate() + dayOffset);

      const dayIndex = (getDayOfYear(date) - 1) % verses.length;

      const verse = verses[dayIndex];
      const fullInterp = reflections[dayIndex];

      document.getElementById("verse").innerText = verse;
      document.getElementById("modal-verse").innerText = verse;

      const introText = fullInterp.length > 180 
        ? fullInterp.substring(0, 180).trim() + '... (tap for full reflection)'
        : fullInterp;
      document.getElementById("intro").innerText = introText;
      document.getElementById("full-interpretation").innerText = fullInterp;

      document.getElementById("day-counter").innerText = `Day ${dayIndex + 1} of ${verses.length}`;
      document.getElementById("current-category").innerText = "Daily Light";
    }

    function updateDate() {
      const date = new Date();
      date.setDate(date.getDate() + dayOffset);
      document.getElementById("date").innerText = date.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    function changeDay(amount) {
      dayOffset += amount;
      updateDate();
      updateDevotional();
    }

    function jumpDays() {
      const value = parseInt(document.getElementById("jumpInput").value, 10);
      if (value >= 1 && value <= verses.length) {
        const today = new Date();
        const target = new Date(today.getFullYear(), 0, value);
        const yearStart = new Date(today.getFullYear(), 0, 1);
        dayOffset = Math.floor((target - yearStart) / 86400000);
        updateDate();
        updateDevotional();
        closeJumpPopup();
      }
    }

    function toggleMenu() {
      const menu = document.getElementById("side-menu");
      const overlay = document.getElementById("overlay");
      menu.classList.toggle("open");
      overlay.classList.toggle("active");
    }

    function openJumpPopup() {
      document.getElementById("jump-popup").classList.add("active");
      document.getElementById("jumpInput").focus();
    }

    function closeJumpPopup() {
      document.getElementById("jump-popup").classList.remove("active");
      document.getElementById("jumpInput").value = "";
    }

    function openModal() {
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("modal");
      const popup = document.getElementById("jump-popup");
      if (event.target === modal) closeModal();
      if (event.target === popup) closeJumpPopup();
    };

    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].screenX; }, { passive: true });
    document.addEventListener('touchend', e => { touchEndX = e.changedTouches[0].screenX; handleSwipe(); }, { passive: true });

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > swipeThreshold) {
        toggleMenu();
      }
    }
