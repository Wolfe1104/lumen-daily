<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Light</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }

    body {
      font-family: 'Playfair Display', serif;
      color: #f5e6d3;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: linear-gradient(rgba(20,10,5,0.85), rgba(40,15,10,0.9));
      position: relative;
      touch-action: pan-y;
    }

    .background {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -2;
      background: url("file_00000000b05871f8b90495cba20701df.png") no-repeat center center / cover;
      filter: brightness(0.35) sepia(0.3);
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 1;
      transition: opacity 5s ease-out;
    }

    #splash.fadeout {
      opacity: 0;
    }

    #splash img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    /* Rest of the app (hidden until splash ends) */
    #app {
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    #app.visible {
      opacity: 1;
    }

    /* Existing styles below (unchanged) */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: flex-end;
      padding: 20px 30px;
      z-index: 100;
    }

    #current-category {
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      color: #d4af37;
      text-shadow: 0 0 10px rgba(212,175,55,0.6);
      font-style: italic;
    }

    footer.title-block {
      padding: 40px 16px 60px;
      z-index: 10;
    }

    .title-block h1 {
      margin: 0;
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(2.8rem, 9vw, 5rem);
      color: #d4af37;
      text-shadow: 0 0 20px rgba(212,175,55,0.7);
      letter-spacing: 2px;
    }

    #date, #day-counter {
      margin: 20px 0 0;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      color: #e6ccb2;
      font-weight: 300;
    }

    .nav-arrows {
      position: fixed;
      top: 50%;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      transform: translateY(-50%);
      pointer-events: none;
      z-index: 11;
    }

    .arrow {
      width: 65px;
      height: 65px;
      background: none;
      border: none;
      cursor: pointer;
      filter: drop-shadow(0 0 12px #d4af37);
      transition: transform 0.3s ease;
      pointer-events: all;
    }

    .arrow:hover { transform: scale(1.25); }
    .arrow svg { width: 100%; height: 100%; fill: #d4af37; }

    .menu-btn {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 1001;
      background: rgba(0,0,0,0.4);
      border: 2px solid #d4af37;
      border-radius: 50%;
      cursor: pointer;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .menu-btn:hover {
      background: #d4af37;
      transform: rotate(90deg) scale(1.1);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 20px 40px;
      max-width: 1100px;
      margin: 0 auto;
      z-index: 10;
    }

    #verse {
      font-size: clamp(1.6rem, 5.5vw, 2.8rem);
      margin: 40px 0;
      color: #e6ccb2;
      cursor: pointer;
      transition: all 0.5s ease;
      line-height: 1.7;
    }

    #verse:hover {
      color: #d4af37;
      text-shadow: 0 0 25px rgba(212,175,55,0.9);
      transform: scale(1.02);
    }

    #intro {
      font-size: clamp(1.3rem, 4.5vw, 2rem);
      color: #c19a6b;
      margin: 50px auto;
      cursor: pointer;
      max-width: 90%;
      line-height: 1.9;
      transition: color 0.4s;
    }

    #intro:hover { color: #d4af37; }

    .side-menu { /* unchanged */ }
    /* ... all other styles remain the same ... */
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash">
    <img src="0G.jpg" alt="Opening Image">
  </div>

  <!-- Main App (initially hidden) -->
  <div id="app">
    <div class="background"></div>

    <header>
      <div id="current-category">Anxiety</div>
    </header>

    <button class="menu-btn" onclick="toggleMenu()" aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="36" height="36">
        <path fill="#d4af37" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>

    <div class="nav-arrows">
      <button class="arrow" onclick="changeDay(-1)" aria-label="Previous day">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <button class="arrow" onclick="changeDay(1)" aria-label="Next day">
        <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>

    <main>
      <h2 id="verse" onclick="openModal()"></h2>
      <p id="intro" onclick="openModal()"></p>
    </main>

    <footer class="title-block">
      <h1>Daily Light</h1>
      <p id="date"></p>
      <p id="day-counter"></p>
    </footer>

    <!-- Side menu, overlay, popups, modal unchanged -->
    <!-- (All HTML from previous version inside #app) -->

    <aside id="side-menu" class="side-menu">
      <!-- ... same as before ... -->
    </aside>

    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div id="jump-popup" class="jump-popup">
      <!-- ... same ... -->
    </div>

    <div id="modal" class="modal">
      <!-- ... same ... -->
    </div>
  </div>

  <script>
    // Splash screen logic
    window.onload = function() {
      const splash = document.getElementById('splash');
      const app = document.getElementById('app');

      // Show splash for 5 seconds, then start 5-second fadeout
      setTimeout(() => {
        splash.classList.add('fadeout');
        // After fadeout completes, show the main app
        setTimeout(() => {
          splash.style.display = 'none';
          app.classList.add('visible');
          // Now initialize the devotional
          updateDate();
          updateDevotional();
        }, 5000); // matches fadeout duration
      }, 5000); // display duration
    };

    // Rest of your script (unchanged)
    let dayOffset = 0;
    let currentCategory = "anxiety";

    // ... (full script from previous version) ...
  </script>
</body>
</html>
