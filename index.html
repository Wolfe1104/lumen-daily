<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Light</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background"></div>

  <!-- Hamburger Menu Button -->
  <button class="menu-btn" onclick="toggleMenu()">
    <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" fill="#d4af37"/></svg>
  </button>

  <div class="nav-arrows">
    <button class="arrow left" onclick="changeDay(-1)">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button class="arrow right" onclick="changeDay(1)">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
  </div>

  <section class="search-controls">
    <input type="number" id="jumpInput" placeholder="Enter day number (1-365)">
    <button onclick="jumpDays()">Search Day</button>
  </section>

  <main>
    <h2 id="verse" onclick="openModal()"></h2>
    <p id="intro" onclick="openModal()"></p>
  </main>

  <!-- Daily Light and date now at the bottom -->
  <footer class="title-block">
    <h1>Daily Light</h1>
    <p id="date"></p>
  </footer>

  <!-- Slide Menu from Left -->
  <div id="side-menu" class="side-menu">
    <div class="menu-header">
      <h3>Choose Focus</h3>
      <span class="close-menu" onclick="toggleMenu()">&times;</span>
    </div>
    <nav class="menu-nav">
      <button onclick="setCategory('anxiety')">
