<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Light</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="background"></div>

  <header>
    <button class="arrow" onclick="changeDay(-1)">&#8592;</button>

    <div class="title-block">
      <h1>Daily Light</h1>
      <p id="date"></p>
      <p id="day-counter"></p>
    </div>

    <button class="arrow" onclick="changeDay(1)">&#8594;</button>
  </header>

  <section class="jump-controls">
    <input type="number" id="jumpInput" placeholder="Days">
    <button onclick="jumpDays()">Jump</button>
  </section>

  <main>
    <h2 id="verse"></h2>
    <p id="interpretation"></p>
  </main>

  <nav>
    <button onclick="setCategory('anxiety')">Anxiety</button>
    <button onclick="setCategory('fear')">Fear</button>
    <button onclick="setCategory('grief')">Grief</button>
    <button onclick="setCategory('sadness')">Sadness</button>
    <button onclick="setCategory('confusion')">Confusion</button>
    <button onclick="setCategory('loneliness')">Loneliness</button>
    <button onclick="setCategory('doubt')">Doubt</button>
    <button onclick="setCategory('weariness')">Weariness</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
